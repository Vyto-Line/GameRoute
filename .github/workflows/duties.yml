name: Pharmacy duties
on:
  schedule:
    - cron: "17 3,9,15,19 * * *"   # 4 times a day (Athens 05/06, 11/12, 17/18, 21/22)
  workflow_dispatch:
    inputs:
      mode:
        description: "probe or build"
        default: "build"
      urls:
        description: "probe: JSON list of [name, url]"
        default: ""
permissions:
  contents: write
concurrency: duties
jobs:
  duties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        if: inputs.mode == 'probe'
        env:
          URLS: ${{ inputs.urls }}
        run: |
          python3 tools/duties_probe.py "$URLS" || true
          cd probe && git init -q && git checkout -q -b duties-probe && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" duties-probe
      - name: Previous file
        if: inputs.mode != 'probe'
        run: |
          mkdir -p out
          git fetch -q origin duties && git --work-tree=out checkout origin/duties -- . || true
      - name: Duty lists
        if: inputs.mode != 'probe'
        run: python3 tools/duties.py
      - name: Publish to the duties branch
        if: inputs.mode != 'probe'
        run: |
          cd out
          rm -rf .git && git init -q && git checkout -q -b duties
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "Duties $(date -u +%FT%H:%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" duties
